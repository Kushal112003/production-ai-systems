name: CI

# Fail-closed by design: no continue-on-error, no `|| true` anywhere.
# A failing lint, test, or eval gate MUST fail the workflow.
# The eval gate arms itself: once a golden dataset exists, it enforces thresholds.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check eval_harness rag_service mcp_gateway tests

      - name: Test
        run: pytest

      - name: Eval gate
        run: python -m eval_harness check
