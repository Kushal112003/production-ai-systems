[project]
name = "production-ai-systems"
version = "0.1.0"
description = "Proof-of-work repo: eval harness + RAG service + MCP gateway (Job Mission)"
requires-python = ">=3.12"
dependencies = [
    # Deps are design decisions: each one must earn its place in a docs/adr/ record.
    # fastapi/uvicorn/httpx: the rag_service API boundary (Day 1 drill onward).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["eval_harness*", "rag_service*", "mcp_gateway*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
